# 每周自动同步上游（给 fork 仓库用）

目标仓库：`horizon288/CloudFlare-ImgBed`（fork）
上游仓库：`MarSeventh/CloudFlare-ImgBed`
同步后：推送到 fork 的 `main` 即触发 Cloudflare Pages 自动部署，无需再手动部署。

## 怎么装

1. 把本文件放到 fork 仓库的 `.github/workflows/sync-upstream-weekly.yml`
2. 在 fork 仓库 Settings → Secrets → Actions 里新建一个 secret，名字 `SYNC_TOKEN`，
   值是一个有 `repo` 写权限的 Personal Access Token（horizon288 账号的）。
   不能只用默认 `GITHUB_TOKEN`：同步要用 force-push，默认 token 在部分设置下推不上去。
3. 装完后在 Actions 页点一次 Run workflow 手动跑一遍，确认能跑通；之后每周自动跑。

## 注意点（都是之前踩过的坑）

- 上游改过历史，所以同步必须用 reset 方式（`git reset --hard upstream/main` + force-push），
  普通 merge / fast-forward 会失败。这也是 2026-11-25 升级时用的方式。
- 大版本升级有时要手动迁移（比如 v2.0 那次 KV 换 D1），同步完最好看一眼上游的更新说明
  和 Pages 部署状态，别完全不管。
- 不要在手动升级/重置同步正在进行时跑这个任务，会互相覆盖。

---

```yaml
name: Sync upstream weekly

on:
  schedule:
    # 每周一 03:00 UTC 跑一次（北京时间 11:00）
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_TOKEN }}
          fetch-depth: 0

      - name: Reset to upstream main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/MarSeventh/CloudFlare-ImgBed.git
          git fetch upstream main
          git checkout main
          git reset --hard upstream/main
          git push --force origin main
```
